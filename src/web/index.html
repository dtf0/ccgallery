<script type="module">
	import { CCGalleryManager, CCGalleryConfig } from './CCGallery.js';

	var galleryConfig = new CCGalleryConfig();
	galleryConfig.thumbnailBorderPixels = 2;
	galleryConfig.rowHeightPixels = 50;
	galleryConfig.menuConfig.galleriesTitle = null;
	galleryConfig.menuConfig.enabled = true;
	galleryConfig.screenSaverConfig.enabled = true;
	galleryConfig.screenSaverConfig.runIntervalMillis = 2000;
	galleryConfig.allGalleryEnabled = false;
	// galleryConfig.photoOverlayContent = "<div class='footer'><a href='#''>order a print</a></div>";

	var galleryManager = new CCGalleryManager(galleryConfig);
	galleryManager.initializePageHandlers();
</script>
